services:
  gui:
    build:
      context: .
      dockerfile: deploy/gui/Dockerfile
    image: "ghcr.io/isaiah-harville/orion/orion-gui:${ORION_VERSION:-latest}"
    environment:
      # Read at runtime. Compose runs the GUI and API on separate ports, so the
      # same-origin default does not apply and this points at the API.
      PUBLIC_ORION_API_URL: ${PUBLIC_ORION_API_URL:-http://localhost:5171/api}
    ports:
      - "5173:5173"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    image: "ghcr.io/isaiah-harville/orion/orion-api:${ORION_VERSION:-latest}"
    environment:
      # ORION_MOSAIC_DIR derives from SCAN_DIR, so it is not set separately.
      SCAN_DIR: /app/scans
      # The GUI is a separate origin locally; in production the ingress
      # terminates the browser's origin and sets its own CORS, so this is empty.
      ORION_CORS_ORIGINS: ${ORION_CORS_ORIGINS:-http://localhost:5173}
      # Requests to the API keep the producer at its full cadence.
      ORION_NEXRAD_DEMAND_URL: http://nexrad:8090/demand
    ports:
      - "5171:5171"
    volumes:
      - radar-data:/app/scans:ro

  nexrad:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: nexrad
    image: "ghcr.io/isaiah-harville/orion/orion-nexrad:${ORION_VERSION:-latest}"
    platform: linux/amd64
    environment:
      SCAN_DIR: /app/scans
      # A regional default so the first frame lands in under a minute. Full
      # CONUS is 140+ stations to list, download, and decode.
      # Set both to go continental:
      #   ORION_NEXRAD_STATIONS=ALL
      #   ORION_NEXRAD_BOUNDS=-125.0,24.0,-66.5,49.5
      ORION_NEXRAD_STATIONS: ${ORION_NEXRAD_STATIONS:-ALL}
      ORION_NEXRAD_BOUNDS: ${ORION_NEXRAD_BOUNDS:--91.5,33.0,-81.0,39.0}
      ORION_NEXRAD_HISTORY_HOURS: ${ORION_NEXRAD_HISTORY_HOURS:-6}
      # Full cadence only while the API has had traffic in the last 15 min;
      # otherwise one frame every 15 min. Set the port to 0 to always run.
      ORION_NEXRAD_DEMAND_PORT: ${ORION_NEXRAD_DEMAND_PORT:-8090}
    volumes:
      - radar-data:/app/scans
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g

volumes:
  radar-data:

networks:
  default:
    name: orion
